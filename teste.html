<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="./teste.css">
  <title>BlobTrack · Teste de Diagnóstico</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

</head>
<body>
  <h1>BlobTrack · Teste de Diagnóstico</h1>
  <p class="sub">Página isolada: valida blob tracking + áudio reativo sem tocar no app principal.</p>
  <div class="stage">
    <canvas id="view"></canvas>
  </div>
  <div class="row">
    <button class="primary" id="startBtn">Iniciar sessão</button>
    <button id="audioBtn" disabled>Áudio: desligado</button>
    <button id="stopBtn" disabled>Encerrar</button>
  </div>
  <div class="diag">
    <table>
      <tr><td>Contexto seguro (HTTPS)</td><td id="d-secure">—</td></tr>
      <tr><td>getUserMedia</td><td id="d-gum">—</td></tr>
      <tr><td>AudioWorklet</td><td id="d-worklet">—</td></tr>
      <tr><td>Câmera</td><td id="d-cam">—</td></tr>
      <tr><td>FPS do ciclo</td><td id="d-fps">—</td></tr>
      <tr><td>Custo de rastreio</td><td id="d-track">—</td></tr>
      <tr><td>Blobs ativos</td><td id="d-blobs">—</td></tr>
      <tr><td>Energia / envelopes</td><td id="d-energy">—</td></tr>
      <tr><td>Áudio (vozes · pico)</td><td id="d-audio">—</td></tr>
    </table>
    <div class="zones" id="zones"></div>
  </div>
  <script type="module" src="./teste.js"></script>
</body>
</html>
